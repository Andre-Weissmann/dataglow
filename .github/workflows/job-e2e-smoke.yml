# ============================================================
# DATAGLOW — CI job: e2e smoke (real Chrome)
# ============================================================
# Reusable workflow (called by .github/workflows/test.yml).
#
# Boots the real app in real Chrome and asserts the DuckDB-WASM engine comes
# alive and the Validate tab populates.
# WHY real Chrome (installed via setup-chrome, not the bundled Playwright
# headless-shell): the WASM + Web Worker + Blob-URL bootstrap that DuckDB-WASM
# relies on can be blocked in stripped headless-sandbox environments. GitHub
# Actions with real Chrome is the authoritative "does it actually work in a
# browser" source of truth — a flaky local headless run is not.

name: e2e smoke (real Chrome)

on:
  workflow_call:

jobs:
  e2e-smoke:
    name: e2e smoke (real Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install real Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      # Point Playwright at the system Chrome installed above rather than
      # downloading its own headless-shell build.
      - name: Run e2e smoke test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e
      # M1 live-catalog regression (2026-07-17): a CREATE TABLE-created table's
      # real columns must be resolved via the live DuckDB catalog and NOT
      # false-flagged as hallucinated references by the SQL Analysis Contract.
      - name: Run analysis-contract e2e test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e-analysiscontract
      # Gen 9 Batch 2: ambient-validation warnings + on-device SLM graceful
      # degradation (both engine-independent, so robust in headless CI).
      - name: Run ambient + SLM e2e test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e-ambient-slm
      # Gen 10 Batch 2: Watch-Folder (driven via the mock-directory test hook, as
      # showDirectoryPicker needs a user gesture) + Digital Twin live simulation,
      # including a network sniffer asserting watched files never leave the device.
      - name: Run watch-folder + digital-twin e2e test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e-watch-twin
      # Regression guard for the cross-origin-isolation load race: on a host that
      # sends no COOP/COEP headers, a fast click during the pre-isolation window
      # (before the one-time SW reload) must be queued + replayed, never dropped.
      - name: Run COI load-race regression test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e-coi-race
      # Gen 42: conversational pack-builder UI wiring. Engine-independent (imports
      # the presenter on a served origin and drives it on a detached host div, no
      # DuckDB), so it's robust in headless CI. Asserts the feature stays dark with
      # the flag off and, with it on, the question→confirm→summary→finalize flow.
      - name: Run conversational pack-builder UI test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e-packbuilder-ui
      # Gen 43 Part 2: meeting scribe Meeting-tab UI wiring. Same engine-independent
      # detached-host approach (no DuckDB). Asserts the 'meeting' tab stays out of
      # the rendered tab list with the flag off and, with it on, the paste-transcript
      # → analyze → pushback/data-request grouping → action-item resolve flow.
      - name: Run meeting scribe UI test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e-meetingscribe-ui
      # Gen 43 Part 3: meeting decision ledger UI wiring. Same engine-independent
      # detached-host approach, with a tiny in-memory fake store standing in for
      # IndexedDB (no real browser storage engine needed in CI). Asserts the
      # ledger stays dark with its own flag off and, with it on, the save →
      # browse → filter-by-chart → export → clear flow.
      - name: Run meeting decision ledger UI test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e-decisionledger-ui
      # Rigor Engine Batch 2: SQL-tab + Visualize-tab grouped confidence badges,
      # plus the SQL→Visualize gap fix ("Send to Visualize"). Forces the dark
      # rigorEngineBadges flag on via a Playwright route intercept on
      # flags.manifest.json (the SW is disabled first, since sw.js's own fetch
      # handler would otherwise intercept the request before Playwright's route
      # ever sees it) and separately confirms the flag-off default renders
      # neither badge nor button.
      - name: Run rigor engine badges e2e test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e-rigor-engine-badges
      # Bundle 2 (A8): Air-Gap Mode. The pure posture engine is unit + golden
      # tested; only a browser can prove the switch has teeth, so this asserts the
      # surface ships dark with the flag off and, with the local opt-in on, that a
      # cross-origin fetch is refused while a same-origin asset still loads and
      # turning the mode off restores window.fetch.
      - name: Run Air-Gap Mode canvas UI test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:airgapui
      # Bundle 14: Repair Ledger panel mount/unmount by its own flag, and the
      # power packs "Project fit" lanes tab appearing only when
      # polyglotProjectLanes is on. The pure engines (ledger, PQ-parity,
      # Arrow deepen, llama fetch status, project lanes) are unit tested in
      # test:bundle14ledger (job-ci-batch-04.yml), no browser needed there.
      - name: Run Bundle 14 canvas UI test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:bundle14canvas
      # Bundle 15: RECEIPT spine Repair Ledger chip mount/unmount by its own
      # flag, the thin-replay human-confirm gate on "Run again" (declines do
      # not touch the SQL editor, accepts insert the exact rerunnable SQL),
      # and SQL Dojo safe-open (no throw against a bare-bones DOM stub, Run
      # disabled with a plain message when no SQL engine is mounted). The
      # pure engines (load-harden candidate list, ledger canRerun/rerunPlan
      # gating, flag-helper shape) are unit tested in
      # test:bundle15loadhardenledgerspine (job-ci-batch-03.yml), no browser
      # needed there.
      - name: Run Bundle 15 canvas UI test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:bundle15canvas
      # The Bench Batch 2: wires the Batch 1 lineage algebra into the live
      # SQL/Python/R tabs. Proves flag OFF (default) keeps all three mounts
      # hidden/empty, and flag ON logs an upload step on dataset load, a sql
      # step on query run, and renders the IDENTICAL lineage across all three
      # tab mounts -- the cross-tab-parity check that a per-tab unit test
      # could not make. Forces theBench on via the same route-intercept +
      # disabled-service-worker pattern as the rigor engine badges test above.
      - name: Run Bench story strip e2e test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e-benchstorystrip
      # The Bench Batch 3: wires the session lineage into the ALREADY-LIVE
      # Trust Strip + Proof Drawer (trustStripProofDrawer, shipped ON) on the
      # Validate tab, rather than a second competing trust surface. Proves a
      # real SQL run's lineage shows up in the Trust Strip's Lineage field
      # after switching tabs (no manual re-render needed) and that clicking it
      # opens the Proof Drawer with the real Bench steps as their own block.
      - name: Run Bench x Trust Strip wiring e2e test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e-benchtruststrip
      # Query Memory (batch 2, final leg): wires the last unwired run path named
      # in the queryMemory flag's own description -- Metric Studio -- into the
      # same fingerprint+log+badge machinery already live for SQL/Python/R.
      # Proves a real "Create metric" save that computes against a loaded table
      # fires the new onMetricComputed hook, and that a second save of the same
      # formula (via the existing duplicate-prompt "Keep both" path) is
      # recognized as seen-before. Engine-independent (a duck-typed fake
      # engine + in-memory store stand in for DuckDB/IndexedDB), so robust in
      # headless CI, same pattern as the Metric Contracts UI test above.
      - name: Run Query Memory Metric Studio wiring e2e test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e-querymemory-metricstudio
      # 2026-09-26: proves the Start here rail's mobile-viewport overlap fix
      # (js/spine/data-glow-receipt-spine-canvas.js) -- defaults collapsed to
      # its chip on narrow-width/short-height viewports instead of covering
      # roughly a third of every tab, stays open as before on desktop/tablet,
      # and is still reachable + height-bounded when opened on mobile on
      # purpose. Same real-Chrome pattern as the bundle15canvas step above.
      - name: Run Start here rail mobile-viewport overlap fix test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:spinemobile
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshot
          path: test/e2e-failure.png
          if-no-files-found: ignore
